<text x="210.0" y="34.0" fill="#d97706" text-anchor="middle" font-size="13" font-weight="normal" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke">×w₁₂ = 6</text>
<text x="420.0" y="100.0" fill="#111827" text-anchor="start" font-size="13" font-weight="bold" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke">Forward</text>
<text x="420.0" y="122.0" fill="#111827" text-anchor="start" font-size="12" font-weight="normal" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke">x₁₁ входит в z₁₁ (×5) и в z₁₂ (×6).</text>
<text x="420.0" y="142.0" fill="#111827" text-anchor="start" font-size="12" font-weight="normal" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke">L = сумма Z ⇒ G = ∂L/∂Z — все единицы.</text>
<text x="420.0" y="164.0" fill="#d97706" text-anchor="start" font-size="13" font-weight="bold" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke">∂L/∂x₁₁ = 1·5 + 1·6 = 11</text>
