<text x="420.0" y="280.0" fill="#dc2626" text-anchor="start" font-size="12" font-weight="normal" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke">· столбец 1 из Wᵀ = 1·5 + 1·6 = 11 ✓</text>
<text x="420.0" y="302.0" fill="#6b7280" text-anchor="start" font-size="12" font-weight="normal" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke">Столбец 1 из Wᵀ — это строка 1 из W:</text>
<text x="420.0" y="320.0" fill="#6b7280" text-anchor="start" font-size="12" font-weight="normal" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke">те же множители, что на стрелках сверху.</text>
<text x="40.0" y="376.0" fill="#111827" text-anchor="start" font-size="14" font-weight="normal" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke">Формы:</text>
<text x="100.0" y="376.0" fill="#111827" text-anchor="start" font-size="14" font-weight="normal" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke"><tspan fill="#111827">∂L/∂X = G·Wᵀ = (n×</tspan><tspan fill="#d97706">p</tspan><tspan fill="#111827">)·(</tspan><tspan fill="#d97706">p</tspan><tspan fill="#111827">×k) = n×k — как у X ✓</tspan></text>
<text x="100.0" y="398.0" fill="#111827" text-anchor="start" font-size="14" font-weight="normal" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke"><tspan fill="#111827">∂L/∂W = Xᵀ·G = (k×</tspan><tspan fill="#d97706">n</tspan><tspan fill="#111827">)·(</tspan><tspan fill="#d97706">n</tspan><tspan fill="#111827">×p) = k×p — как у W ✓</tspan></text>
<text x="40.0" y="420.0" fill="#6b7280" text-anchor="start" font-size="12" font-weight="normal" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke">Внутренние размеры (оранжевые) обязаны совпасть — так формулу восстанавливают по формам.</text>
